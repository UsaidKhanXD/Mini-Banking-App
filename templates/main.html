<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Banking App - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 500px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-bar h2 {
            font-size: 20px;
            color: #f8fafc;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-history {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-history:hover {
            background-color: #475569;
        }

        .btn-logout {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: #dc2626;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .balance-card h3 {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            color: #38bdf8;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .action-btn {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .action-btn:hover {
            background-color: #334155;
            border-color: #38bdf8;
        }

        .panel {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 24px;
            border-radius: 12px;
            display: none;
            margin-bottom: 24px;
        }

        .panel h4 {
            margin-bottom: 16px;
            color: #38bdf8;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header-bar">
            <h2>Welcome, {{ user.name }}</h2>
            <div class="header-actions">
                <a href="/history" class="btn-history">History</a>
                <a href="/login" class="btn-logout">Logout</a>
            </div>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <h3>Current Balance</h3>
            <div class="balance-amount">${{ user.balance }}</div>
            <p style="color: #94a3b8; font-size: 13px; margin-top: 6px;">{{ user.email }}</p>
        </div>

        <!-- Action Buttons Grid -->
        <div class="actions-grid">
            <button class="action-btn" onclick="togglePanel('deposit-panel')">+ Deposit</button>
            <button class="action-btn" onclick="togglePanel('withdraw-panel')">- Withdraw</button>
        </div>

        <!-- Deposit Panel Form -->
        <div id="deposit-panel" class="panel">
            <h4>Deposit Funds</h4>
            <form action="/deposit" method="POST">
                <div class="input-group">
                    <label>Amount ($)</label>
                    <input type="number" step="0.01" name="amount" placeholder="Enter amount to deposit" required>
                </div>
                <button type="submit" class="btn-submit">Confirm Deposit</button>
            </form>
        </div>

        <!-- Withdrawal Panel Form -->
        <div id="withdraw-panel" class="panel">
            <h4>Withdraw Funds</h4>
            <form action="/withdraw" method="POST">
                <div class="input-group">
                    <label>Amount ($)</label>
                    <input type="number" step="0.01" name="amount" placeholder="Enter amount to withdraw" required>
                </div>
                <button type="submit" class="btn-submit">Confirm Withdrawal</button>
            </form>
        </div>
    </div>

    <script>
        function togglePanel(panelId) {
            const depositPanel = document.getElementById('deposit-panel');
            const withdrawPanel = document.getElementById('withdraw-panel');
            
            if (panelId === 'deposit-panel') {
                depositPanel.style.display = depositPanel.style.display === 'block' ? 'none' : 'block';
                withdrawPanel.style.display = 'none';
            } else {
                withdrawPanel.style.display = withdrawPanel.style.display === 'block' ? 'none' : 'block';
                depositPanel.style.display = 'none';
            }
        }
    </script>
</body>
</html>
