<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - Mini Banking App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-bar h2 {
            font-size: 22px;
            color: #f8fafc;
        }

        .btn-back {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-back:hover {
            background-color: #475569;
        }

        /* Two Column Layout matching your sketch */
        .history-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .column {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            min-height: 350px;
            max-height: 450px;
            overflow-y: auto;
        }

        .column h3 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .column.withdraw h3 {
            color: #ef4444;
        }

        .column.deposit h3 {
            color: #38bdf8;
        }

        .empty-text {
            color: #64748b;
            text-align: center;
            margin-top: 80px;
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h2>Transaction History</h2>
            <a href="/dashboard" class="btn-back">Dashboard</a>
        </div>

        <div class="history-grid">
    <!-- Withdraw Column -->
    <div class="column withdraw">
        <h3>Withdraw Statements</h3>
        <p>{{ user.withdraw_history | safe }}</p>
    </div>

    <!-- Deposit Column -->
    <div class="column deposit">
        <h3>Deposit Statements</h3>
        <p>{{ user.deposit_history | safe }}</p>
    </div>
</div>
    </div>
</body>
</html>
